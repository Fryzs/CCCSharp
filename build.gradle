plugins {
    id 'java-library'
    id 'net.neoforged.moddev' version '2.0.140'
}

version = mod_version
group = mod_group_id

base {
    archivesName = mod_id
}

java.toolchain.languageVersion = JavaLanguageVersion.of(21)

repositories {
    mavenCentral()
    exclusiveContent {
        forRepository {
            maven {
                name = 'SquidDev'
                url = 'https://maven.squiddev.cc'
            }
        }
        filter { includeGroup 'cc.tweaked' }
    }
}

neoForge {
    version = project.neo_version

    runs {
        // ./gradlew runGameTestServer: headless, no window; checks the mod inside a real CC: Tweaked.
        gameTestServer {
            type = 'gameTestServer'
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }
    }

    mods {
        "${mod_id}" {
            sourceSet(sourceSets.main)
        }
    }
}

dependencies {
    // CC: Tweaked public API (Lua API factory, @LuaFunction).
    compileOnly "cc.tweaked:cc-tweaked-1.21.1-core-api:${cc_version}"
    compileOnly "cc.tweaked:cc-tweaked-1.21.1-common-api:${cc_version}"
    compileOnly "cc.tweaked:cc-tweaked-1.21.1-forge-api:${cc_version}"

    // Tests: compile C# programs and run the Lua on Cobalt, the same Lua VM CC: Tweaked uses.
    testImplementation platform('org.junit:junit-bom:5.11.3')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
    testImplementation "cc.tweaked:cobalt:${cobalt_version}"
}

test {
    useJUnitPlatform()
    testLogging {
        events 'failed'
        exceptionFormat 'full'
        showStandardStreams = false
    }
}

var generateModMetadata = tasks.register('generateModMetadata', ProcessResources) {
    var replaceProperties = [
            minecraft_version      : minecraft_version,
            minecraft_version_range: minecraft_version_range,
            neo_version            : neo_version,
            mod_id                 : mod_id,
            mod_name               : mod_name,
            mod_license            : mod_license,
            mod_version            : mod_version,
    ]
    inputs.properties replaceProperties
    expand replaceProperties
    from 'src/main/templates'
    into 'build/generated/sources/modMetadata'
}
sourceSets.main.resources.srcDir generateModMetadata
neoForge.ideSyncTask generateModMetadata

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}
